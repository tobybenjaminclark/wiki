---
layout: default
---

<section class="post">
  <h2>{{ page.title }}</h2>
  {{ content }}
  <span class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time> &middot; {% for tag in page.tags %}
    {% assign tag_slug = tag | slugify %}<a href="{{ '/tag/' | append: tag_slug | append: '/' | relative_url }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}</span>
</section>
