---
layout: default
---

<section class="post{% if page.collection == 'publications' %} publication-entry{% endif %}">
  <h2>{{ page.title }}</h2>
  {{ content }}
  {% if page.collection != "publications" and page.date %}
    <span class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></span>
  {% endif %}
</section>
